version: '3.9'
services:
  devtools:
    container_name: devtools
    user: runwhen
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      - RW_MODE=dev
      - RW_IDE_TOOLS=${RW_IDE_TOOLS:-claude,opencode,zen}
    volumes:
      - .:/workspaces
    ports:
      - 3000:3000
